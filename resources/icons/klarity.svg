<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d99f3"/>
      <stop offset="50%" stop-color="#3daee9"/>
      <stop offset="100%" stop-color="#1abc9c"/>
    </linearGradient>
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3daee9" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="facet2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a085" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2ecc71" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="facet3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9b59b6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3498db" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile Background -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="#1b242f" />
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#2c3e50" stroke-width="2" />

  <!-- Crystal / Prism Shape representing Klarity (clarity & precision) -->
  <g filter="url(#glow)">
    <!-- Top apex to center -->
    <polygon points="64,24 88,48 64,68 40,48" fill="url(#facet1)" />
    <!-- Center to bottom apex -->
    <polygon points="40,48 64,68 64,104 28,68" fill="url(#facet2)" />
    <polygon points="88,48 64,68 64,104 100,68" fill="url(#facet3)" />
    <!-- Upper facets -->
    <polygon points="64,24 40,48 28,68 46,62" fill="#2980b9" opacity="0.6"/>
    <polygon points="64,24 88,48 100,68 82,62" fill="#8e44ad" opacity="0.6"/>
    <!-- Central Highlights -->
    <line x1="64" y1="24" x2="64" y2="104" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="28" y1="68" x2="100" y2="68" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Precision Dot -->
  <circle cx="64" cy="68" r="3.5" fill="#ffffff" filter="url(#glow)"/>
</svg>
